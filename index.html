<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a> <a href="/dataviz">Data·Viz</a>
        <a href="/about">About</a> <a href="/contact">Contact</a>
      </nav>
    </header>
    <main class="intro">
      <div id="tsparticles"></div>
      <h1 class="name">Dolores · Messer</h1>
      <p class="bio">Data specialist with a passion for data visualization!</p>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/dolores-messer">
          <img
            src="icons/linkedin-black.svg"
            alt="LinkedIn"
            class="social-links-icon"
          />
        </a>
        <a href="https://www.github.com/domess">
          <img
            src="icons/github-black.svg"
            alt="GitHub"
            class="social-links-icon"
          />
        </a>
        <a href="mailto:dolores.messer@gmail.com">
          <img
            src="icons/email-black.svg"
            alt="Email"
            class="social-links-icon"
          />
        </a>
      </div>
    </main>

    <!-- JavaScript: Particles in the background -->
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@4/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@4/tsparticles.slim.bundle.min.js"></script>

    <script>
      (async () => {
        await loadSlim(tsParticles);

        await tsParticles.load({
          id: "tsparticles",
          options: {
            fullScreen: { enable: false },
            background: { color: "transparent" },
            particles: {
              number: {
                value: 45,
                density: { enable: true },
              },
              color: { value: "#8196A7" },
              opacity: { value: 1 },
              size: { value: { min: 4, max: 15 } },
              move: {
                enable: true,
                speed: 0.6,
                direction: "none",
                random: true,
                straight: false,
                outModes: { default: "out" },
              },
              links: { enable: false },
            },
            interactivity: {
              events: {
                onHover: { enable: false },
                onClick: { enable: false },
              },
            },
            detectRetina: true,
          },
        });
      })();
    </script>
  </body>
</html>
